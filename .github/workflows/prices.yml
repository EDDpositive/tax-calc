name: update prices
on:
  schedule:
    - cron: "30 22 * * 1-5"   # 미국 장 마감 뒤 (한국 시간 다음 날 07:30)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_prices.py
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "update prices"
          git push
